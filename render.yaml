# Render Blueprint — deploys the OSEP Laravel API as a FREE Docker web service.
# In Render: New +  ->  Blueprint  ->  pick this repo. It reads this file.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: osep-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Generate locally with:  php artisan key:generate --show
      - key: APP_KEY
        sync: false
      # Your Render URL,   e.g. https://osep-api.onrender.com
      - key: APP_URL
        sync: false
      # Your Vercel URL,   e.g. https://osep.vercel.app  (used by CORS)
      - key: FRONTEND_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      # smtp | resend | log  (Render blocks outbound SMTP, so use resend for real delivery)
      - key: MAIL_MAILER
        sync: false
      # Resend API key — https://resend.com/api-keys (only needed if MAIL_MAILER=resend)
      - key: RESEND_KEY
        sync: false
      # ---- Database (free managed MySQL: TiDB Cloud Serverless or Aiven) ----
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false            # TiDB Cloud Serverless = 4000
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Enables TLS to the DB using the container's built-in CA bundle.
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt
      # ---- Uploads (Render's container disk is wiped on every deploy —
      # avatars/logos/venue photos need real object storage to survive one).
      # Set up a free Cloudflare R2 bucket, then fill these in.
      - key: FILESYSTEM_PUBLIC_DRIVER
        sync: false             # local | s3  (s3 talks to R2 here)
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false             # R2 uses "auto"
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false             # https://<account-id>.r2.cloudflarestorage.com
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        sync: false             # true for R2
      - key: AWS_URL
        sync: false             # the bucket's public base URL (r2.dev or custom domain)
